spring.application.name=securescan
server.port=${SERVER_PORT:8081}

# ---- PostgreSQL (credentials come from environment variables; nothing is hardcoded) ----
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/antivirus_db}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
# Fail fast (10 s) with a clear error if the database cannot be reached
spring.datasource.hikari.connection-timeout=10000

# ---- JPA / Hibernate ----
# "update" creates/alters tables automatically. Good for development, NOT for production
# (use Flyway/Liquibase migrations there). See README.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---- Pagination limits ----
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

# ---- Swagger / OpenAPI ----
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ---- Logging ----
logging.level.root=INFO
logging.level.com.securescan=DEBUG
logging.level.org.hibernate.SQL=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n
server.port=8081